<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Littlefoot Racing — Pit Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1a1a;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  #status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; display: inline-block; margin-right: 6px;
    transition: background 0.3s;
  }
  #status-dot.online  { background: #27AE60; }
  #status-dot.offline { background: #C0392B; }
  #status-label { font-size: 13px; color: #999; }

  /* ── Driver selector bar ── */
  #driver-bar {
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #driver-bar-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  #driver-roster { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .driver-chip {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #777;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .driver-chip.active { background: #E67E22; border-color: #E67E22; color: white; }
  .driver-chip:active { opacity: 0.7; }
  #driver-add {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid #333; background: none; color: #555;
    font-size: 20px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #driver-add:active { color: #fff; border-color: #fff; }
  #driver-none { color: #444; font-size: 12px; font-style: italic; }

  .driver-chip { display: flex; align-items: center; gap: 8px; padding-right: 6px; user-select: none; }
  .chip-timer { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500; opacity: 0.75; }
  .chip-x {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; opacity: 0.55;
  }
  .chip-x:hover, .chip-x:active { opacity: 1; background: rgba(0,0,0,0.35); }
  #driver-stats-btn {
    height: 28px; border-radius: 14px; padding: 0 10px;
    border: 1px solid #333; background: none; color: #777;
    font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  #driver-stats-btn.open { color: #fff; border-color: #E67E22; }

  /* ── Offline alarm banner ── */
  #offline-banner {
    display: none; position: sticky; top: 0; z-index: 100;
    padding: 18px 16px 14px; text-align: center; color: #fff;
    background: #C0392B; border-bottom: 4px solid #fff;
    animation: offlinePulse 0.9s ease-in-out infinite;
  }
  #offline-banner.show { display: block; }
  #offline-banner .ob-title { font-size: 34px; font-weight: 900; letter-spacing: 2px; line-height: 1.1; }
  #offline-banner .ob-sub { font-size: 14px; opacity: 0.9; margin-top: 6px; }
  #offline-banner .ob-mute {
    margin-top: 10px; background: rgba(0,0,0,0.35); color: #fff; border: 1px solid rgba(255,255,255,0.6);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  @keyframes offlinePulse { 0%, 100% { background: #C0392B; } 50% { background: #7B1E15; } }

  /* ── Driver stats panel ── */
  #stats-panel { display: none; padding: 10px 16px 14px; border-bottom: 1px solid #222; overflow-x: auto; flex-shrink: 0; }
  #stats-panel.open { display: block; }
  .stats-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stats-head h2 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .stats-reset { background: none; border: 1px solid #333; color: #666; border-radius: 6px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
  table.stats { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 520px; }
  table.stats th { text-align: left; color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 4px 8px; border-bottom: 1px solid #222; }
  table.stats td { padding: 7px 8px; border-bottom: 1px solid #161616; vertical-align: top; }
  table.stats tr.total td { color: #999; border-top: 1px solid #333; border-bottom: none; }
  table.stats .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  table.stats .live { color: #E67E22; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; margin: 2px 3px 0 0; color: #fff; }

  /* ── Driver alert cards ── */
  #alerts {
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .alert-card {
    border-radius: 10px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: slideIn 0.2s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s, transform 0.2s;
  }
  .alert-card:active { opacity: 0.7; transform: scale(0.98); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(60px); max-height: 0; padding: 0; margin: 0; }
  }
  .alert-card.dismissing {
    animation: slideOut 0.2s ease forwards;
    overflow: hidden;
  }
  .alert-card .alert-left  { display: flex; flex-direction: column; gap: 2px; }
  .alert-card .alert-label { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .alert-card .alert-time  { font-size: 11px; opacity: 0.65; }
  .alert-card .alert-dismiss { font-size: 20px; opacity: 0.5; padding-left: 12px; }

  .card-BOX_REQUEST { background: #C0392B; }
  .card-FUEL_LOW    { background: #E67E22; }
  .card-ALL_GOOD    { background: #27AE60; }
  .card-ACKNOWLEDGE { background: #2980B9; }

  #no-alerts { color: #444; font-size: 13px; padding: 10px 0; text-align: center; }

  /* ── Send commands ── */
  #commands {
    padding: 10px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .cmd-btn {
    border: none; border-radius: 10px; padding: 16px 10px;
    font-size: 17px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; text-transform: uppercase;
    color: white; transition: opacity 0.15s, transform 0.1s;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .cmd-btn:active { opacity: 0.75; transform: scale(0.97); }
  .cmd-btn .cmd-sub { font-size: 10px; font-weight: 400; opacity: 0.75; text-transform: none; }
  .cmd-btn.sent { outline: 3px solid white; }

  .btn-BOX_NOW   { background: #C0392B; }
  .btn-BOX_NEXT  { background: #E67E22; }
  .btn-FUEL      { background: #D35400; }
  .btn-STAY_OUT  { background: #27AE60; }
  .btn-ACK       { background: #2980B9; }
  .btn-CAUTION   { background: #F1C40F; color: #111; }
  .btn-PIT_NOW   { background: #8E44AD; }
  .btn-STANDBY   { background: #333; }

  /* ── Dual logs ── */
  #logs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    flex: 1;
    min-height: 0;
    border-top: 1px solid #222;
  }
  .log-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .log-col:first-child { border-right: 1px solid #222; }
  .log-col h2 {
    font-size: 11px; color: #444; text-transform: uppercase;
    letter-spacing: 1px; padding: 8px 12px 6px;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .log-col h2 span { float: right; font-size: 14px; }
  .log-scroll {
    flex: 1;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11px;
  }
  .log-entry {
    padding: 4px 12px;
    border-bottom: 1px solid #111;
    line-height: 1.4;
  }
  .log-entry .ts   { color: #444; display: block; font-size: 10px; }
  .log-entry .msg  { color: #bbb; }
  .log-entry.car-to-pit .msg { color: #E67E22; }
  .log-entry.pit-to-car .msg { color: #2980B9; }
</style>
</head>
<body>

<header>
  <h1>&#127937; LITTLEFOOT PIT</h1>
  <div>
    <span id="status-dot" class="offline"></span>
    <span id="status-label">Car offline</span>
  </div>
</header>

<!-- Big offline alarm -->
<div id="offline-banner" role="alert">
  <div class="ob-title" id="ob-title"></div>
  <div class="ob-sub" id="ob-sub"></div>
  <button class="ob-mute" id="ob-mute" onclick="toggleMute()">&#128263; Mute alarm sound</button>
</div>

<!-- Driver selector -->
<div id="driver-bar">
  <span id="driver-bar-label">Driver</span>
  <div id="driver-roster"><span id="driver-none">No drivers — tap + to add</span></div>
  <button id="driver-add" title="Add driver">+</button>
  <button id="driver-stats-btn" title="Driver stats">&#128202; Stats</button>
</div>
<div id="stats-panel"></div>

<!-- Driver button alerts -->
<div id="alerts">
  <div id="no-alerts">No driver messages yet</div>
</div>

<!-- Pit send buttons -->
<div id="commands">
  <button class="cmd-btn btn-BOX_NOW"  onclick="send('BOX_NOW')">BOX NOW<span class="cmd-sub">Come in this lap</span></button>
  <button class="cmd-btn btn-BOX_NEXT" onclick="send('BOX_NEXT')">BOX +1<span class="cmd-sub">Next lap</span></button>
  <button class="cmd-btn btn-FUEL"     onclick="send('FUEL')">FUEL<span class="cmd-sub">Fuel concern</span></button>
  <button class="cmd-btn btn-STAY_OUT" onclick="send('STAY_OUT')">STAY OUT<span class="cmd-sub">Keep pushing</span></button>
  <button class="cmd-btn btn-ACK"      onclick="send('ACK')">GOT IT<span class="cmd-sub">Acknowledged</span></button>
  <button class="cmd-btn btn-CAUTION"  onclick="send('CAUTION')">CAUTION<span class="cmd-sub">Slow down</span></button>
  <button class="cmd-btn btn-PIT_NOW"  onclick="send('PIT_NOW')">PIT NOW<span class="cmd-sub">Urgent — box now</span></button>
  <button class="cmd-btn btn-STANDBY"  onclick="send('STANDBY')">STANDBY<span class="cmd-sub">All clear</span></button>
</div>

<!-- Dual logs -->
<div id="logs">
  <div class="log-col">
    <h2>Car → Pit <span>🚗</span></h2>
    <div class="log-scroll" id="log-car"></div>
  </div>
  <div class="log-col">
    <h2>Pit → Car <span>📡</span></h2>
    <div class="log-scroll" id="log-pit"></div>
  </div>
</div>

<script>
const RELAY_URL = 'wss://littlefoot-race-comms-production.up.railway.app';

// ── Driver roster, drive timers & call stats ─────────────────────────────────
const STORE_KEY = 'pitState.v1';
const UNASSIGNED = 'Unassigned';
const $ = (id) => document.getElementById(id);

function loadState() {
  try {
    const st = JSON.parse(localStorage.getItem(STORE_KEY));
    if (st && st.stats && Array.isArray(st.roster)) return st;
  } catch {}
  let roster = [];
  try { roster = JSON.parse(localStorage.getItem('driverRoster') || '[]'); } catch {}
  return { roster, current: null, since: null, stats: {} };
}
let S = loadState();
let currentDriver = S.current;

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    localStorage.setItem('driverRoster', JSON.stringify(S.roster));
  } catch {}
}
function esc(v) {
  return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function statFor(name) {
  const k = name || UNASSIGNED;
  if (!S.stats[k]) S.stats[k] = { driveMs: 0, stints: 0, sent: {}, recv: {} };
  return S.stats[k];
}
function driveMs(name) {
  const st = S.stats[name];
  let ms = st ? st.driveMs : 0;
  if (name === S.current && S.since) ms += Date.now() - S.since;
  return ms;
}
function fmtDur(ms) {
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  const p = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

function bankCurrent() {
  if (S.current && S.since) statFor(S.current).driveMs += Date.now() - S.since;
  S.since = null;
}
// Local state change only (used for remote set_driver messages too)
function applyDriver(name) {
  name = name || null;
  if (name === S.current) return;
  bankCurrent();
  S.current = name;
  currentDriver = name;
  if (name) { S.since = Date.now(); statFor(name).stints++; }
  saveState();
  renderRoster();
  renderStats();
}
function sendDriver(name) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'set_driver', name }));
  }
}
// Tap a driver to put them in the car (starts their timer); tap the active driver again to stop the timer.
function selectDriver(name) {
  const next = (name === S.current) ? null : name;
  applyDriver(next);
  sendDriver(next);
}

function removeDriver(name) {
  if (!confirm(`Remove ${name} from the roster?\n\nTheir drive time and call history are kept if you add them back.`)) return;
  if (S.current === name) { applyDriver(null); sendDriver(null); }
  S.roster = S.roster.filter((n) => n !== name);
  saveState();
  renderRoster();
  renderStats();
}

function renderRoster() {
  const roster = $('driver-roster');
  roster.innerHTML = '';
  if (S.roster.length === 0) {
    roster.innerHTML = '<span id="driver-none">No drivers — tap + to add</span>';
    return;
  }
  S.roster.forEach((name) => {
    const chip = document.createElement('div');
    chip.className = 'driver-chip' + (name === S.current ? ' active' : '');
    chip.setAttribute('role', 'button');
    const label = document.createElement('span');
    label.textContent = name;
    const timer = document.createElement('span');
    timer.className = 'chip-timer';
    timer.dataset.driver = name;
    timer.textContent = fmtDur(driveMs(name));
    const x = document.createElement('span');
    x.className = 'chip-x';
    x.textContent = '✕';
    x.title = 'Remove driver';
    x.onclick = (e) => { e.stopPropagation(); removeDriver(name); };
    chip.append(label, timer, x);
    chip.onclick = () => selectDriver(name);
    roster.appendChild(chip);
  });
}

$('driver-add').addEventListener('click', () => {
  const name = prompt('Driver name:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (trimmed === UNASSIGNED) return;
  if (!S.roster.includes(trimmed)) {
    S.roster.push(trimmed);
    saveState();
    renderRoster();
  }
  if (S.current !== trimmed) selectDriver(trimmed);
});

// ── Call stats ──
function recordCall(dir, code) {
  const st = statFor(S.current);
  const bucket = dir === 'recv' ? st.recv : st.sent;
  bucket[code] = (bucket[code] || 0) + 1;
  saveState();
  renderStats();
}

const PIT_COLORS = {
  BOX_NOW: '#C0392B', BOX_NEXT: '#E67E22', FUEL: '#D35400', STAY_OUT: '#27AE60',
  ACK: '#2980B9', CAUTION: '#F1C40F', PIT_NOW: '#8E44AD', STANDBY: '#555',
};
const CAR_COLORS = { BOX_REQUEST: '#C0392B', FUEL_LOW: '#E67E22', ALL_GOOD: '#27AE60', ACKNOWLEDGE: '#2980B9' };

function sum(map) { return Object.values(map).reduce((a, b) => a + b, 0); }
function pills(map, colors) {
  const ents = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (!ents.length) return '<span style="color:#444">—</span>';
  return ents.map(([c, n]) =>
    `<span class="pill" style="background:${colors[c] || '#444'};${c === 'CAUTION' ? 'color:#111' : ''}">${esc(c.replace(/_/g, ' '))} ×${n}</span>`
  ).join('');
}

function renderStats() {
  const panel = $('stats-panel');
  if (!panel.classList.contains('open')) return;
  const names = [...S.roster];
  const un = S.stats[UNASSIGNED];
  if (un && (sum(un.sent) || sum(un.recv))) names.push(UNASSIGNED);

  let totMs = 0, totRecv = 0, totSent = 0;
  const rows = names.map((name) => {
    const st = S.stats[name] || { stints: 0, sent: {}, recv: {} };
    const ms = name === UNASSIGNED ? 0 : driveMs(name);
    const r = sum(st.recv), t = sum(st.sent);
    totMs += ms; totRecv += r; totSent += t;
    const live = name === S.current;
    return `<tr>
      <td><strong class="${live ? 'live' : ''}">${live ? '● ' : ''}${esc(name)}</strong></td>
      <td class="num ${live ? 'live' : ''}">${name === UNASSIGNED ? '—' : fmtDur(ms)}</td>
      <td class="num">${name === UNASSIGNED ? '—' : st.stints}</td>
      <td><span class="num">${r}</span> ${pills(st.recv, CAR_COLORS)}</td>
      <td><span class="num">${t}</span> ${pills(st.sent, PIT_COLORS)}</td>
    </tr>`;
  });

  panel.innerHTML = `
    <div class="stats-head"><h2>Driver stats</h2><button class="stats-reset" onclick="resetStats()">Reset stats</button></div>
    <table class="stats">
      <thead><tr><th>Driver</th><th>Drive time</th><th>Stints</th><th>Calls from driver</th><th>Calls to driver</th></tr></thead>
      <tbody>${rows.join('') || '<tr><td colspan="5" style="color:#444">No drivers yet</td></tr>'}
        <tr class="total"><td>Total</td><td class="num">${fmtDur(totMs)}</td><td></td><td class="num">${totRecv}</td><td class="num">${totSent}</td></tr>
      </tbody>
    </table>`;
}

function resetStats() {
  if (!confirm('Reset all drive times and call counts?')) return;
  S.stats = {};
  if (S.current) { S.since = Date.now(); statFor(S.current).stints = 1; } else { S.since = null; }
  saveState();
  renderRoster();
  renderStats();
}

$('driver-stats-btn').addEventListener('click', () => {
  $('stats-panel').classList.toggle('open');
  $('driver-stats-btn').classList.toggle('open', $('stats-panel').classList.contains('open'));
  renderStats();
});

// Live timers
setInterval(() => {
  document.querySelectorAll('.chip-timer').forEach((el) => { el.textContent = fmtDur(driveMs(el.dataset.driver)); });
  renderStats();
  updateOfflineAlert();
}, 1000);

const MESSAGES = {
  BOX_NOW:  { text: 'Box now',      sub: 'Come in this lap' },
  BOX_NEXT: { text: 'Box +1',       sub: 'Box next lap' },
  FUEL:     { text: 'Fuel',         sub: 'Fuel concern — monitor' },
  STAY_OUT: { text: 'Stay out',     sub: 'Keep pushing' },
  ACK:      { text: 'Got it',       sub: 'Pit received your message' },
  CAUTION:  { text: 'Caution',      sub: 'Slow down — hazard' },
  PIT_NOW:  { text: 'Pit now',      sub: 'Urgent — box immediately' },
  STANDBY:  { text: 'Standing by',  sub: '' },
};

const DRIVER_LABELS = {
  BOX_REQUEST: { label: '🟥 BOX REQUEST', color: '#C0392B' },
  FUEL_LOW:    { label: '🟧 FUEL LOW',    color: '#E67E22' },
  ALL_GOOD:    { label: '🟩 ALL GOOD',    color: '#27AE60' },
  ACKNOWLEDGE: { label: '✅ ACKNOWLEDGE', color: '#2980B9' },
};

let ws, reconnectTimer;
let retryDelay = 2000, openedAt = 0, gotDriverSync = false;

function ts() {
  return new Date().toLocaleTimeString('en-US', { hour12: false });
}

function addCarLog(text) {
  const el = document.createElement('div');
  el.className = 'log-entry car-to-pit';
  el.innerHTML = `<span class="ts">${ts()}</span><span class="msg">${text}</span>`;
  const log = document.getElementById('log-car');
  log.prepend(el);
  if (log.children.length > 200) log.lastChild.remove();
}

function addPitLog(text) {
  const el = document.createElement('div');
  el.className = 'log-entry pit-to-car';
  el.innerHTML = `<span class="ts">${ts()}</span><span class="msg">${text}</span>`;
  const log = document.getElementById('log-pit');
  log.prepend(el);
  if (log.children.length > 200) log.lastChild.remove();
}

function dismissCard(card) {
  card.classList.add('dismissing');
  card.addEventListener('animationend', () => {
    card.remove();
    if (document.getElementById('alerts').children.length === 0) {
      const placeholder = document.createElement('div');
      placeholder.id = 'no-alerts';
      placeholder.textContent = 'No driver messages yet';
      document.getElementById('alerts').appendChild(placeholder);
    }
  }, { once: true });
}

function addAlert(code, driver) {
  const info = DRIVER_LABELS[code];
  if (!info) return;

  const noAlerts = document.getElementById('no-alerts');
  if (noAlerts) noAlerts.remove();

  const alerts = document.getElementById('alerts');
  const card = document.createElement('div');
  card.className = `alert-card card-${code}`;
  card.innerHTML = `
    <div class="alert-left">
      <span class="alert-label">${info.label}</span>
      <span class="alert-time">${driver ? `<strong>${esc(driver)}</strong> · ` : ''}${ts()}</span>
    </div>
    <span class="alert-dismiss">✕</span>
  `;
  card.addEventListener('click', () => dismissCard(card));
  alerts.prepend(card);

  while (alerts.children.length > 10) alerts.lastChild.remove();
  // playGoat(3);
}

// Preload roar audio
const roarAudio = new Audio('roar.mp3');
roarAudio.load();

function playGoat(count) {
  // Use real audio file if available
  if (roarAudio.readyState >= 2) {
    let plays = 0;
    function playNext() {
      if (plays >= count) return;
      const clip = roarAudio.cloneNode();
      clip.play().catch(() => {});
      clip.onended = () => { plays++; playNext(); };
    }
    playNext();
    return;
  }

  // Fallback synthesis
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Waveshaper distortion curve for that gritty dino rumble
    function makeDistortion(amount) {
      const samples = 256;
      const curve = new Float32Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function roar(startTime) {
      const dur = 1.4;

      // Low rumble — the chest of the roar
      const low = ctx.createOscillator();
      low.type = 'sawtooth';
      low.frequency.setValueAtTime(55,  startTime);
      low.frequency.linearRampToValueAtTime(95,  startTime + 0.3);
      low.frequency.linearRampToValueAtTime(130, startTime + 0.7);
      low.frequency.linearRampToValueAtTime(80,  startTime + 1.1);
      low.frequency.linearRampToValueAtTime(45,  startTime + dur);

      // Mid screech — the throat of the roar
      const mid = ctx.createOscillator();
      mid.type = 'sawtooth';
      mid.frequency.setValueAtTime(180, startTime);
      mid.frequency.linearRampToValueAtTime(320, startTime + 0.25);
      mid.frequency.linearRampToValueAtTime(480, startTime + 0.6);
      mid.frequency.linearRampToValueAtTime(380, startTime + 0.9);
      mid.frequency.linearRampToValueAtTime(140, startTime + dur);

      // Slow growl LFO
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 4;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(low.frequency);
      lfoGain.connect(mid.frequency);

      // Distortion for that crunchy monster texture
      const dist = ctx.createWaveShaper();
      dist.curve = makeDistortion(300);
      dist.oversample = '4x';

      // Low pass to keep it beefy not tinny
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1800;
      lp.Q.value = 2;

      // Amplitude envelope — slow build, long sustain, tail off
      const env = ctx.createGain();
      env.gain.setValueAtTime(0,    startTime);
      env.gain.linearRampToValueAtTime(0.6, startTime + 0.15);
      env.gain.setValueAtTime(0.55, startTime + 0.9);
      env.gain.exponentialRampToValueAtTime(0.001, startTime + dur);

      const envMid = ctx.createGain();
      envMid.gain.setValueAtTime(0,    startTime);
      envMid.gain.linearRampToValueAtTime(0.2, startTime + 0.2);
      envMid.gain.setValueAtTime(0.18, startTime + 0.9);
      envMid.gain.exponentialRampToValueAtTime(0.001, startTime + dur);

      low.connect(env);
      mid.connect(envMid);
      env.connect(dist);
      envMid.connect(dist);
      dist.connect(lp);
      lp.connect(ctx.destination);

      [lfo, low, mid].forEach(n => n.start(startTime));
      [lfo, low, mid].forEach(n => n.stop(startTime + dur + 0.1));
    }

    let t = ctx.currentTime + 0.05;
    for (let i = 0; i < count; i++) {
      roar(t);
      t += 1.6;
    }
  } catch {}
}

function send(code) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    alert('Not connected to relay server');
    return;
  }
  const info = MESSAGES[code] || { text: code, sub: '' };
  ws.send(JSON.stringify({ type: 'pit_message', code, text: info.text, sub: info.sub }));
  addPitLog(`${code}${currentDriver ? ` (${esc(currentDriver)})` : ''}`);
  recordCall('sent', code);

  const btn = document.querySelector(`.btn-${code}`);
  if (btn) {
    btn.classList.add('sent');
    setTimeout(() => btn.classList.remove('sent'), 800);
  }
}

function setCarStatus(online) {
  document.getElementById('status-dot').className = online ? 'online' : 'offline';
  document.getElementById('status-label').textContent = online ? 'Car connected' : 'Car offline';
  carOnline = online;
  updateOfflineAlert();
}

// ── Offline alarm ────────────────────────────────────────────────────────────
const baseTitle = document.title;
const graceUntil = Date.now() + 4000;   // don't alarm while first connecting
let relayUp = false, carOnline = null;  // carOnline: null = unknown
let alarmKind = null, alarmSince = null, alarmMuted = false, alarmTimer = null, titleFlip = false;
let audioCtx = null;

// Browsers only allow sound after a tap/click, so arm audio on first interaction
document.addEventListener('click', () => {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
});

function beep() {
  try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch {}
  if (!audioCtx || audioCtx.state !== 'running') return;
  const t = audioCtx.currentTime;
  [0, 0.28].forEach((off) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = off ? 660 : 880;
    g.gain.setValueAtTime(0.0001, t + off);
    g.gain.exponentialRampToValueAtTime(0.25, t + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.24);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + off); o.stop(t + off + 0.26);
  });
}

function toggleMute() {
  alarmMuted = !alarmMuted;
  $('ob-mute').innerHTML = alarmMuted ? '&#128266; Unmute alarm sound' : '&#128263; Mute alarm sound';
  if (alarmMuted) stopAlarmSound(); else if (alarmKind) startAlarmSound();
}
function startAlarmSound() {
  if (alarmMuted || alarmTimer) return;
  beep();
  alarmTimer = setInterval(beep, 2500);
}
function stopAlarmSound() { clearInterval(alarmTimer); alarmTimer = null; }

function updateOfflineAlert() {
  let kind = null;
  if (!relayUp) { if (Date.now() >= graceUntil) kind = 'relay'; }
  else if (carOnline === false) kind = 'car';

  const banner = $('offline-banner');
  if (!kind) {
    alarmKind = null; alarmSince = null;
    banner.classList.remove('show');
    stopAlarmSound();
    document.title = baseTitle;
    return;
  }
  if (kind !== alarmKind) {            // new or changed alarm: restart clock + sound
    alarmKind = kind; alarmSince = Date.now();
    stopAlarmSound();
  }
  banner.classList.add('show');
  $('ob-title').textContent = kind === 'car' ? '🚨 CAR OFFLINE 🚨' : '⚠ NO CONNECTION TO RELAY';
  $('ob-sub').textContent = (kind === 'car'
    ? 'Driver will NOT receive pit messages'
    : 'Dashboard can’t reach the server — car status unknown, reconnecting…')
    + ' · down ' + fmtDur(Date.now() - alarmSince);
  titleFlip = !titleFlip;
  document.title = titleFlip ? (kind === 'car' ? '🚨 CAR OFFLINE' : '⚠ NO RELAY') : baseTitle;
  startAlarmSound();
}

function connect() {
  ws = new WebSocket(RELAY_URL);

  ws.onopen = () => {
    openedAt = Date.now();
    gotDriverSync = false;
    relayUp = true;
    updateOfflineAlert();
    ws.send(JSON.stringify({ type: 'register', role: 'pit' }));
    addPitLog('connected to relay');
    // If the relay has no driver set, push ours so other tabs stay in sync
    setTimeout(() => { if (!gotDriverSync && S.current) sendDriver(S.current); }, 1000);
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'car_status') {
      setCarStatus(msg.online);
      addCarLog(`car ${msg.online ? 'connected ✓' : 'disconnected'}`);
    } else if (msg.type === 'button_press') {
      addAlert(msg.code, currentDriver);
      addCarLog(`${msg.code}${currentDriver ? ` (${esc(currentDriver)})` : ''}`);
      recordCall('recv', msg.code);
    } else if (msg.type === 'set_driver') {
      gotDriverSync = true;
      applyDriver(msg.name);
    } else if (msg.type === 'pit_message') {
      addPitLog(`${msg.code} (other tab)`);
      recordCall('sent', msg.code);
    }
  };

  ws.onclose = () => {
    relayUp = false;
    setCarStatus(false);
    carOnline = null;
    updateOfflineAlert();
    addPitLog('relay disconnected — reconnecting…');
    clearTimeout(reconnectTimer);
    if (openedAt && Date.now() - openedAt > 30000) retryDelay = 2000;  // was stable, start over
    openedAt = 0;
    reconnectTimer = setTimeout(connect, retryDelay + Math.random() * 1000);
    retryDelay = Math.min(retryDelay * 2, 30000);
  };

  ws.onerror = () => ws.close();
}

renderRoster();
connect();
</script>
